services:
  # =====================================================================
  # 1. MINIO : Object Storage S3 (Couches Bronze & Silver)
  # =====================================================================
  minio:
    image: coollabsio/minio:latest
    container_name: medallion-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio_data:/data
    networks:
      - medallion-network

  # =====================================================================
  # 2. MINIO-INIT : Initialisation automatique des buckets Bronze & Silver
  # =====================================================================
  minio-init:
    build:
      context: ./docker/minio-init
      dockerfile: Dockerfile
    container_name: medallion-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    networks:
      - medallion-network

  # =====================================================================
  # 3. POSTGRESQL : Couche Gold (Data Warehouse relationnel & Data Marts)
  # =====================================================================
  postgres:
    image: postgres:16-alpine
    container_name: medallion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-gold_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gold_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - medallion-network

  # =====================================================================
  # 4. METABASE : Couche Visualisation / BI (Connectée à PostgreSQL Gold)
  # =====================================================================
  metabase:
    image: metabase/metabase:latest
    container_name: medallion-metabase
    restart: unless-stopped
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medallion-network

  # =====================================================================
  # 5. JUPYTERLAB : Environnement Pédagogique (Python, PySpark, Pandas)
  # =====================================================================
  jupyter:
    build:
      context: ./docker/jupyter
      dockerfile: Dockerfile
    container_name: medallion-jupyter
    restart: unless-stopped
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-medallion}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-gold_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./data:/workspace/data
      - ./scripts:/workspace/scripts
    depends_on:
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - medallion-network

  # =====================================================================
  # 6. COURSE-WEB (NGINX) : Serveur Web du Cours Interactif
  # =====================================================================
  course-web:
    image: nginx:alpine
    container_name: medallion-course-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./course-website:/usr/share/nginx/html:ro
    networks:
      - medallion-network

networks:
  medallion-network:
    name: medallion-network
    driver: bridge

volumes:
  minio_data:
    name: medallion_minio_data
  postgres_data:
    name: medallion_postgres_data
  metabase_data:
    name: medallion_metabase_data
